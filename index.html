<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Telephone Pole Jump</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <!-- Hidden input for mobile virtual keyboard on nickname screen -->
  <input id="nick-input" type="text" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0;">
  <!-- Load order: shared dependencies first, game.js last -->
  <!-- Firebase (online ranking) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script src="js/sound.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/game.js"></script>

  <!--
    Google AdSense (optional):
    Replace ca-pub-XXXXXXXXXXXXXXXX with your publisher ID.
  -->
  <!--
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  -->
</body>
</html>
