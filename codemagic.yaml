workflows:
  ios-distribution:
    name: iOS App Store Distribution
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: com.jinraiinc.telephonepolejump
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: latest
      xcode: latest
      cocoapods: default
      groups:
        - ios_credentials

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up keychain and code signing
        script: |
          keychain initialize

          # Revoke existing Distribution certificates (both types) to free up the slot
          for CERT_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            CERT_IDS=$(app-store-connect certificates list \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
              --type "$CERT_TYPE" \
              --json 2>/dev/null \
            | python3 -c "import sys,json; print('\n'.join(c['id'] for c in (json.load(sys.stdin) or []) if isinstance(c,dict) and 'id' in c))" 2>/dev/null || true)
            for cert_id in $CERT_IDS; do
              echo "Revoking $CERT_TYPE certificate: $cert_id"
              app-store-connect certificates delete "$cert_id" \
                --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
                --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
                --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" || true
            done
          done

          # Generate a fresh certificate private key for this build
          CERT_KEY=$(openssl genrsa 2048 2>/dev/null)

          # Use --certificate-key so the tool creates a CSR from our key,
          # avoiding "Cannot save Signing Certificates without certificate private key"
          app-store-connect fetch-signing-files \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "$CERT_KEY" \
            --type IOS_APP_STORE \
            "$BUNDLE_ID" \
            --create

          keychain add-certificates

          # Copy profiles to the MobileDevice location where xcode-project use-profiles expects them
          MOBILE_PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$MOBILE_PROFILES"
          find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name "*.mobileprovision" \
            -exec cp {} "$MOBILE_PROFILES/" \; 2>/dev/null || true

          PROFILE=$(find "$MOBILE_PROFILES" -name "*.mobileprovision" | head -1)
          if [ -z "$PROFILE" ]; then
            echo "ERROR: No provisioning profile found"
            exit 1
          fi

          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Set build version
        script: |
          LATEST_APPSTORE=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" 2>/dev/null || echo "0")
          LATEST_TESTFLIGHT=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" 2>/dev/null || echo "0")
          LATEST=$(( LATEST_APPSTORE > LATEST_TESTFLIGHT ? LATEST_APPSTORE : LATEST_TESTFLIGHT ))
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest App Store: $LATEST_APPSTORE, Latest TestFlight: $LATEST_TESTFLIGHT -> New build: $BUILD_NUMBER"
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
